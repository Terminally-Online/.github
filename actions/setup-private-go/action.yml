name: Setup private Go module access
description: >-
  Mint a per-run GitHub App installation token and route private
  terminally-online Go module fetches through it. Replaces a human PAT — the
  token is Contents:Read only and expires within the hour, and there is nothing
  to rotate. Drop this into any repo's CI before `go` commands that need a
  private terminally-online dependency.

inputs:
  app-id:
    description: GitHub App ID (org secret CI_APP_ID).
    required: true
  private-key:
    description: GitHub App private key PEM (org secret CI_APP_PRIVATE_KEY).
    required: true
  repositories:
    description: >-
      Private repos the minted token may read, newline or comma separated.
      Defaults to subsync — the only private module in the graph today. Add
      more here if a repo pulls additional private terminally-online modules.
    required: false
    default: subsync
  goprivate:
    description: GOPRIVATE glob for private module paths.
    required: false
    default: github.com/terminally-online/*

runs:
  using: composite
  steps:
    - name: Mint installation token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repositories }}

    - name: Route private module fetches through the token
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
        echo "GOPRIVATE=${{ inputs.goprivate }}" >> "$GITHUB_ENV"

    - name: Wait for token propagation
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        IFS=', ' read -ra repos <<< "$(echo "${{ inputs.repositories }}" | tr '\n' ' ')"
        for repo in "${repos[@]}"; do
          [ -z "$repo" ] && continue
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository_owner }}/${repo}" HEAD > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::app token never propagated for ${repo}"
              exit 1
            fi
            sleep $((attempt * 2))
          done
        done
